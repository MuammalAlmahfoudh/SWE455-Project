name: Destroy Cloud Environment

on:
  workflow_dispatch:
    inputs:
      confirm_phrase:
        description: 'Type DESTROY to confirm teardown'
        required: true
        type: string

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/volleyball-api

jobs:
  terraform-destroy:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_phrase == 'DESTROY' }}
    env:
      TF_INPUT: "false"
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Terraform init
        run: terraform init -input=false

      - name: Import existing infrastructure
        run: |
          chmod +x scripts/import-existing-infra.sh
          ./scripts/import-existing-infra.sh

      - name: Terraform destroy with retries
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Destroy attempt ${attempt} of 3"

            if terraform destroy -input=false -auto-approve \
              -var="container_image=${{ env.IMAGE_NAME }}:latest"; then
              exit 0
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Terraform destroy failed after 3 attempts."
              exit 1
            fi

            echo "Terraform destroy hit an AWS dependency race. Waiting 90 seconds before retrying..."
            sleep 90
          done

  missing-confirmation:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm_phrase != 'DESTROY' }}
    steps:
      - name: Fail on missing confirmation
        run: |
          echo "You must type DESTROY to run this workflow."
          exit 1
