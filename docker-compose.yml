services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: volleyball_analytics
      DB_PORT: 5432
    depends_on:
      - db
    networks:
      - volleyball-network

  db:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: volleyball_analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - volleyball-network

networks:
  volleyball-network:
    driver: bridge

volumes:
  postgres-data:
